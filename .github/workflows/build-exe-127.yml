
name: Build Journal EXE 127

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'main.js'
      - 'preload.js'
      - 'package.json'
      - '.github/workflows/build-exe-127.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Verify required files
        shell: pwsh
        run: |
          $required = @('index.html','main.js','preload.js','package.json')
          foreach ($file in $required) {
            if (!(Test-Path $file)) {
              Write-Error "Missing file: $file"
              exit 1
            }
          }

      - name: Install dependencies
        run: npm install

      - name: Build Windows 64-bit installer
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: journal-exe-127-installer
          path: dist/Journal-127-Setup.exe
          if-no-files-found: error
