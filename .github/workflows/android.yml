name: Build LAN Messenger APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'lan_messenger_android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p lan_messenger_android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LAN-Messenger-APK
          path: lan_messenger_android/app/build/outputs/apk/debug/*.apk
